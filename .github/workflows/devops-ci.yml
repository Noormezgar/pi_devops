name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-ci:
    name: Backend Build & Sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # business-service
      - name: Build & Sonar business-service
        run: mvn -B clean verify sonar:sonar -Dsonar.projectKey=business-service -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        working-directory: ./back/business-domain/microservices-project

      # partner-performance-service
      - name: Build & Sonar partner-performance-service
        run: mvn -B clean verify sonar:sonar -Dsonar.projectKey=partner-performance-service -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        working-directory: ./back/business-domain/partner-performance-service

      # partner-contract-service
      - name: Build & Sonar partner-contract-service
        run: mvn -B clean verify sonar:sonar -Dsonar.projectKey=partner-contract-service -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        working-directory: ./back/business-domain/partner-contract-service

      # partner-billing-service
      - name: Build & Sonar partner-billing-service
        run: mvn -B clean verify sonar:sonar -Dsonar.projectKey=partner-billing-service -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        working-directory: ./back/business-domain/partner-billing-service

      # partner-intelligence-service
      - name: Build & Sonar partner-intelligence-service
        run: mvn -B clean verify sonar:sonar -Dsonar.projectKey=partner-intelligence-service -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        working-directory: ./back/business-domain/partner-intelligence-service

      # voucher-fraud-service
      - name: Build & Sonar voucher-fraud-service
        run: mvn -B clean verify sonar:sonar -Dsonar.projectKey=voucher-fraud-service -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        working-directory: ./back/business-domain/voucher-fraud-service

  frontend-ci:
    name: Frontend Build & Sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './front/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./front

      - name: Run Angular Tests
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage
        working-directory: ./front

      - name: Build Angular Application
        run: npx ng build
        working-directory: ./front

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: front
