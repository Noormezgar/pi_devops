# SonarQube Configuration for partner-billing-service
sonar.projectKey=partner-billing-service
sonar.projectName=partner-billing-service
sonar.projectVersion=0.0.1-SNAPSHOT

# Sources
sonar.sources=src/main/java
sonar.tests=src/test/java

# Language
sonar.language=java

# Encoding
sonar.sourceEncoding=UTF-8

# Java version
sonar.java.source=17
sonar.java.target=17

# Exclusions
sonar.exclusions=**/target/**,**/*.xml

# Test execution
sonar.testExecutionReportPaths=target/surefire-reports/TEST-*.xml

# Coverage
sonar.jacoco.reportPaths=target/jacoco.exec