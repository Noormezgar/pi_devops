version: '3.8'

services:

mysql:
image: mysql:8.0
container_name: forme-mysql
restart: unless-stopped
environment:
MYSQL_ROOT_PASSWORD: root
MYSQL_DATABASE: forme
ports:
- "3306:3306"
volumes:
- mysql_data:/var/lib/mysql
healthcheck:
test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot || exit 1"]
interval: 15s
timeout: 10s
retries: 20
start_period: 40s

partner-performance-service:
build: ./business-domain/partner-performance-service
container_name: partner-performance-service
restart: unless-stopped
ports:
- "8094:8094"
environment:
SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/forme?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
SPRING_DATASOURCE_USERNAME: root
SPRING_DATASOURCE_PASSWORD: root
depends_on:
mysql:
condition: service_healthy

partner-contract-service:
build: ./business-domain/partner-contract-service
container_name: partner-contract-service
restart: unless-stopped
ports:
- "8092:8092"
environment:
SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/forme?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
SPRING_DATASOURCE_USERNAME: root
SPRING_DATASOURCE_PASSWORD: root
depends_on:
mysql:
condition: service_healthy

volumes:
mysql_data:
